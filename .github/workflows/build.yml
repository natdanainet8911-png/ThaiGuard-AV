name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pyinstaller ThaiGuardAV.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ThaiGuardAV-exe
          path: dist/ThaiGuardAV.exe